[versions]
# Build
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"

# SDK
compileSdk = "37"
targetSdk = "37"
minSdk = "28"

# Libraries
activityCompose = "1.13.0"
androidxHilt = "1.4.0"
biometric = "1.1.0"
